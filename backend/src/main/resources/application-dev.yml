# 로컬 개발 프로필. 접속 정보는 환경 변수 또는 저장소 루트의 .env(커밋 금지)에서 읽는다.
spring:
  config:
    import:
      - optional:file:../.env[.properties] # backend 폴더에서 실행할 때
      - optional:file:.env[.properties] # 저장소 루트에서 실행할 때
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true

# NFR-02: 쿼리 로그로 N+1을 확인한다
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
