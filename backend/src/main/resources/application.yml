# 모든 프로필 공통 설정. 비밀 정보는 여기에 쓰지 않는다.
spring:
  application:
    name: eduhub
  profiles:
    default: dev
  jpa:
    open-in-view: false # NFR-02: 지연 로딩이 컨트롤러까지 새지 않게 한다
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 바꾼다
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # NFR-04: 에러 응답을 RFC 9457 ProblemDetail 형식으로 통일

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
