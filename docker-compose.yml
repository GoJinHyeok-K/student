# NFR-06: 개발용 PostgreSQL. 접속 정보는 저장소 루트의 .env(커밋 금지)에서 읽는다.
# 실행: docker compose up -d (저장소 루트에서)
# 로컬에 설치한 PostgreSQL이 5432를 쓰고 있으면 그 서비스를 먼저 멈춘다 (D-05)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER가 필요하다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 필요하다}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB가 필요하다}
    ports:
      - "5432:5432"
    volumes:
      - eduhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eduhub-pgdata:
